[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-match"
version = "0.1.0"
description = "Local dog-breed photo matching web app and CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.0",
  "python-multipart==0.0.20",
  "Pillow==11.1.0",
  "numpy==2.2.3",
]

[project.optional-dependencies]
model = [
  "torch==2.6.0",
  "transformers==4.49.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "pytest-playwright==0.7.0",
]

[project.scripts]
dog-match = "dog_match.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dog_match = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["dog_match"]

[tool.coverage.report]
fail_under = 80.1
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/dog_match"]
strict = true
ignore_missing_imports = true
